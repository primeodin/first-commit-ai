[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "first-commit-ai"
version = "0.1.0"
description = "Your first AI GitHub repo — tiny chat CLI with mock tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PrimeOdin" }]
dependencies = [
  "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
first-commit-ai = "first_commit_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
